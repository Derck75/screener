name: C metriques
on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

jobs:
  metriques:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Metriques via le noyau
        env:
          CF_ACCOUNT: ${{ secrets.CF_ACCOUNT_ID }}
          CF_DB: ${{ secrets.CF_D1_SCREENER_ID }}
          CF_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: node src/incr5_metriques.mjs

  prix:
    runs-on: ubuntu-latest
    needs: metriques
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Etage prix
        env:
          CF_ACCOUNT: ${{ secrets.CF_ACCOUNT_ID }}
          CF_DB: ${{ secrets.CF_D1_SCREENER_ID }}
          CF_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: python src/incr6_prix.py

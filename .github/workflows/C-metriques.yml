name: C metriques
# Declenche a l'heure par le worker Cloudflare (DECLENCHEURS, 16 h UTC : cours
# de cloture europeens avant l'alerte d'exception de 17 h). Le `schedule` de
# GitHub n'est plus qu'un filet : il saute si la chaine a reussi dans les 20 h.
on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

concurrency:
  group: screener-metriques
  cancel-in-progress: false

jobs:
  garde:
    runs-on: ubuntu-latest
    outputs:
      faire: ${{ steps.g.outputs.faire }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: src
      - id: g
        env:
          CF_ACCOUNT: ${{ secrets.CF_ACCOUNT_ID }}
          CF_DB: ${{ secrets.CF_D1_SCREENER_ID }}
          CF_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: python3 src/garde.py --etape incr7_valorisation --heures 20

  metriques:
    runs-on: ubuntu-latest
    needs: garde
    if: needs.garde.outputs.faire == 'true'
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Metriques via le noyau
        env:
          CF_ACCOUNT: ${{ secrets.CF_ACCOUNT_ID }}
          CF_DB: ${{ secrets.CF_D1_SCREENER_ID }}
          CF_TOKEN: ${{ secrets.CF_API_TOKEN }}
          PLAFOND_ECRITURES: "70000"
        run: node src/incr5_metriques.mjs

  prix:
    runs-on: ubuntu-latest
    needs: metriques
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Etage prix
        env:
          CF_ACCOUNT: ${{ secrets.CF_ACCOUNT_ID }}
          CF_DB: ${{ secrets.CF_D1_SCREENER_ID }}
          CF_TOKEN: ${{ secrets.CF_API_TOKEN }}
          PLAFOND_ECRITURES: "70000"
          PYTHONUNBUFFERED: "1"
        run: python src/incr6_prix.py

  # Ratios de prix par le noyau du worker (seuil N deux phases, EPV, devises)
  # — audit C2. Apres les cours : il lit `metriques.cours` et la capitalisation.
  valorisation:
    runs-on: ubuntu-latest
    needs: prix
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Valorisation via le noyau
        env:
          CF_ACCOUNT: ${{ secrets.CF_ACCOUNT_ID }}
          CF_DB: ${{ secrets.CF_D1_SCREENER_ID }}
          CF_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: node src/incr7_valorisation.mjs

name: A univers
on:
  schedule:
    - cron: '11 2 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  vaneck:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: VanEck
        env:
          CF_ACCOUNT: ${{ secrets.CF_ACCOUNT_ID }}
          CF_DB: ${{ secrets.CF_D1_SCREENER_ID }}
          CF_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: python src/incr2_vaneck.py
      - name: Keepalive
        if: always()
        run: |
          date -u +%FT%TZ > .keepalive
          git config user.name "screener-bot"
          git config user.email "screener-bot@users.noreply.github.com"
          git add .keepalive
          git diff --staged --quiet || git commit -m "keepalive"
          git push || true

  sec:
    runs-on: ubuntu-latest
    needs: vaneck
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Univers SEC
        env:
          CF_ACCOUNT: ${{ secrets.CF_ACCOUNT_ID }}
          CF_DB: ${{ secrets.CF_D1_SCREENER_ID }}
          CF_TOKEN: ${{ secrets.CF_API_TOKEN }}
          SEC_UA: ${{ secrets.SEC_UA }}
        run: python src/incr3_univers_us.py

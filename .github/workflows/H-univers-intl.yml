name: H univers international
on:
  # Une fois par mois, en ecriture : sans cela l'univers international etait
  # fige a sa premiere ecriture — les nouvelles cotations n'y entraient jamais.
  schedule:
    - cron: '41 3 2 * *'
  workflow_dispatch:
    inputs:
      ecrire:
        description: 'Ecrire dans la base ? Sinon exploration seule'
        required: false
        default: 'non'
        type: choice
        options: [non, oui]
      cap_min:
        description: 'Capitalisation minimale EN EUROS'
        required: false
        default: '300000000'

concurrency:
  group: screener-intl
  cancel-in-progress: false

jobs:
  univers:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Univers international
        env:
          CF_ACCOUNT: ${{ secrets.CF_ACCOUNT_ID }}
          CF_DB: ${{ secrets.CF_D1_SCREENER_ID }}
          CF_TOKEN: ${{ secrets.CF_API_TOKEN }}
          PLAFOND_ECRITURES: "70000"
          PYTHONUNBUFFERED: "1"
        run: >
          python src/univers_intl.py --d1
          ${{ (github.event_name == 'schedule' || inputs.ecrire == 'oui') && '--ecrire' || '' }}
          --cap-min ${{ inputs.cap_min || 300000000 }}

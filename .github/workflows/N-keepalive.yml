name: N keepalive
# GitHub DESACTIVE les workflows programmes d'un depot public apres soixante
# jours sans activite. Le screener etant concu pour tourner seul, tout se
# serait arrete sans bruit vers la fin novembre. Un commit mensuel du fichier
# `.keepalive` suffit a maintenir le depot actif.
on:
  schedule:
    - cron: '17 5 1 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Entretien du depot
        run: |
          date -u +%Y-%m-%dT%H:%M:%SZ > .keepalive
          git config user.name "screener-keepalive"
          git config user.email "screener-keepalive@users.noreply.github.com"
          git add .keepalive
          git commit -m "keepalive $(date -u +%F)" || echo "rien a enregistrer"
          git push

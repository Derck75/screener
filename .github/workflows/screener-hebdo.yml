name: screener hebdo
on:
  schedule:
    - cron: '41 1 * * 6'
  workflow_dispatch:

jobs:
  hebdo:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Increment 3 univers US
        env:
          CF_ACCOUNT: ${{ secrets.CF_ACCOUNT_ID }}
          CF_DB: ${{ secrets.CF_D1_SCREENER_ID }}
          CF_TOKEN: ${{ secrets.CF_API_TOKEN }}
          SEC_UA: ${{ secrets.SEC_UA }}
        run: python src/incr3_univers_us.py
      - name: Increment 4 comptes US
        env:
          CF_ACCOUNT: ${{ secrets.CF_ACCOUNT_ID }}
          CF_DB: ${{ secrets.CF_D1_SCREENER_ID }}
          CF_TOKEN: ${{ secrets.CF_API_TOKEN }}
          SEC_UA: ${{ secrets.SEC_UA }}
        run: python src/incr4_comptes_us.py

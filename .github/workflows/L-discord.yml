name: L discord
on:
  # Dimanche 18 h UTC. Une cadence hebdomadaire, jamais quotidienne : un
  # screener quality-growth converge, et un flux quotidien produirait surtout
  # de la pression a agir sur un portefeuille qui n'a pas de place.
  # Declenche a l'heure par le worker Cloudflare (DECLENCHEURS) ; ces deux
  # `schedule` restent en FILET, minute decalee, et sautent si l'envoi a deja
  # eu lieu (garde).
  schedule:
    - cron: '7 18 * * 0'
  # Verification de l'exception chaque jour a 17 h, sans message hebdomadaire.
    - cron: '7 17 * * 1-6'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Mode'
        required: false
        default: hebdo
        type: choice
        options:
          - hebdo
          - amorcage
          - exception
          - rattrapage

concurrency:
  group: screener-discord
  cancel-in-progress: false

jobs:
  garde:
    runs-on: ubuntu-latest
    outputs:
      faire: ${{ steps.g.outputs.faire }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: src
      - id: g
        env:
          CF_ACCOUNT: ${{ secrets.CF_ACCOUNT_ID }}
          CF_DB: ${{ secrets.CF_D1_SCREENER_ID }}
          CF_TOKEN: ${{ secrets.CF_API_TOKEN }}
          # Le mode vient du schedule (filet) OU de l'entree du declenchement
          # a l'heure par le worker : sans la seconde, un envoi d'exception
          # declenche par le worker etait garde comme un hebdo (72 h) et saute.
          EXCEPTION: ${{ github.event.schedule == '7 17 * * 1-6' || inputs.mode == 'exception' }}
          MODE: ${{ inputs.mode }}
        run: |
          if [ "$MODE" = "amorcage" ] || [ "$MODE" = "rattrapage" ]; then
            echo "faire=true" >> "$GITHUB_OUTPUT"   # geste manuel delibere : jamais garde
          elif [ "$EXCEPTION" = "true" ]; then
            python3 src/garde.py --etape incr10_discord_exception --heures 12
          else
            python3 src/garde.py --etape incr10_discord --heures 72
          fi

  discord:
    runs-on: ubuntu-latest
    needs: garde
    if: needs.garde.outputs.faire == 'true'
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Notification Discord
        env:
          CF_ACCOUNT: ${{ secrets.CF_ACCOUNT_ID }}
          CF_DB: ${{ secrets.CF_D1_SCREENER_ID }}
          CF_TOKEN: ${{ secrets.CF_API_TOKEN }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          PLAFOND_ECRITURES: "70000"
          PYTHONUNBUFFERED: "1"
        run: >
          python src/incr10_discord.py
          ${{ inputs.mode == 'amorcage' && '--amorcage'
           || inputs.mode == 'rattrapage' && '--rattrapage'
           || (inputs.mode == 'exception' || github.event.schedule == '7 17 * * 1-6')
              && '--exception-seule' || '' }}

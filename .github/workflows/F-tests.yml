name: F tests noyau
on:
  workflow_dispatch:
  push:
    paths:
      - 'src/**'

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Noms non definis dans les scripts
        run: cd src && python verif_noms.py
      - name: Non-regression du noyau
        run: node src/test_noyau.mjs

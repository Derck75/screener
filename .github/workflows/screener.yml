name: screener
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ingestion:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Increment 2 VanEck
        env:
          CF_ACCOUNT: ${{ secrets.CF_ACCOUNT_ID }}
          CF_DB: ${{ secrets.CF_D1_SCREENER_ID }}
          CF_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: python src/incr2_vaneck.py
      - name: Keepalive
        if: always()
        run: |
          date -u +%FT%TZ > .keepalive
          git config user.name "screener-bot"
          git config user.email "screener-bot@users.noreply.github.com"
          git add .keepalive
          git diff --staged --quiet || git commit -m "keepalive"
          git push || true

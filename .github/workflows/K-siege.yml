name: K sieges
on:
  workflow_dispatch:
    inputs:
      rejouer:
        description: 'Rejouer les societes deja resolues, pour rattraper l activite'
        required: false
        default: 'non'
        type: choice
        options: [non, oui]
      lot:
        description: 'Nombre de societes a resoudre par run'
        required: false
        default: '1200'

concurrency:
  group: screener-ecriture
  cancel-in-progress: false

jobs:
  sieges:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Pays de siege reel
        env:
          CF_ACCOUNT: ${{ secrets.CF_ACCOUNT_ID }}
          CF_DB: ${{ secrets.CF_D1_SCREENER_ID }}
          CF_TOKEN: ${{ secrets.CF_API_TOKEN }}
          PLAFOND_ECRITURES: "0"
          SEC_UA: ${{ secrets.SEC_UA }}
          LOT_SIEGE: ${{ inputs.lot || 1200 }}
          PYTHONUNBUFFERED: "1"
        run: python src/incr9_siege.py ${{ inputs.rejouer == 'oui' && '--rejouer' || '' }}
